<h2>Bundles</h2>
<form method="POST" action="/bundles">
    <div class="cards">
        <label class="card checkbox-card">
            <input type="checkbox" name="bundle" value="core" checked>
            <div>
                <h3>core</h3>
                <p>Core programs</p>
            </div>
        </label>
        <label class="card checkbox-card">
            <input type="checkbox" name="bundle" value="desktop" checked>
            <div>
                <h3>desktop</h3>
                <p>Desktop applications</p>
            </div>
        </label>
        <label class="card checkbox-card">
            <input type="checkbox" name="bundle" value="dev">
            <div>
                <h3>dev</h3>
                <p>Development tools</p>
            </div>
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
