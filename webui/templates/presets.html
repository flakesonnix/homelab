<h2>Presets</h2>
<form method="POST" action="/presets">
    <div class="cards">
        <label class="card checkbox-card">
            <input type="checkbox" name="preset" value="gaming-base" checked>
            <div>
                <h3>gaming-base</h3>
                <p>Base gaming configuration</p>
            </div>
        </label>
        <label class="card checkbox-card">
            <input type="checkbox" name="preset" value="gaming-steam" checked>
            <div>
                <h3>gaming-steam</h3>
                <p>Steam integration</p>
            </div>
        </label>
        <label class="card checkbox-card">
            <input type="checkbox" name="preset" value="gaming-performance">
            <div>
                <h3>gaming-performance</h3>
                <p>Performance optimizations</p>
            </div>
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
