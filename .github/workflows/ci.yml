name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-light:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - run: nix eval .#formatter.x86_64-linux.drvPath --raw
        name: Evaluate formatter output
      - run: nix eval .#devShells.x86_64-linux.default.drvPath --raw
        name: Evaluate dev shell output
      - run: nix eval .#apps.x86_64-linux.rebuild.type --raw
        name: Evaluate app outputs

  check-full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - run: nix build .#full-ci-checks --fallback
        name: Run full CI checks

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - run: nix eval .#nixosConfigurations.x270.config.system.build.toplevel.outPath --raw
        name: Evaluate NixOS config

  purr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - run: nix build ./purr#checks.x86_64-linux.purr-tests --fallback
        name: Purr tests (23)

  purr-check-json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - run: nix build ./purr -o /tmp/purr-bin
        name: Build purr
      - name: Check --json contract
        run: |
          set -euo pipefail
          echo "=== minimal (ok true, no diagnostics, exit 0, stderr empty) ==="
          /tmp/purr-bin/bin/purr check purr/examples/minimal.purr --json > /tmp/min.json 2> /tmp/min.stderr
          jq -e '.ok == true and .diagnostics == []' /tmp/min.json
          test ! -s /tmp/min.stderr
          echo "=== unknown-role (ok false, E042, exit 1, stderr empty) ==="
          if /tmp/purr-bin/bin/purr check purr/tests/fixtures/unknown-role.purr --json > /tmp/unknown.json 2> /tmp/unknown.stderr; then echo "expected failure" && exit 1; fi
          jq -e '.ok == false and .diagnostics[0].code == "E042" and .diagnostics[0].codeName == "unknown_role"' /tmp/unknown.json
          test ! -s /tmp/unknown.stderr
          echo "=== duplicate-host (E010) ==="
          if /tmp/purr-bin/bin/purr check purr/tests/fixtures/duplicate-host.purr --json > /tmp/dup.json 2> /tmp/dup.stderr; then echo "expected failure" && exit 1; fi
          jq -e '.ok == false and .diagnostics[0].code == "E010"' /tmp/dup.json
          echo "=== unknown_ident (E003) ==="
          cat > /tmp/check_unknown_ident.purr <<'EOP'
          host x270 { s = unknown; }
          EOP
          if /tmp/purr-bin/bin/purr check /tmp/check_unknown_ident.purr --json > /tmp/unknown_ident.json 2> /tmp/unknown_ident.stderr; then echo "expected failure" && exit 1; fi
          jq -e '.ok == false and .diagnostics[0].code == "E003"' /tmp/unknown_ident.json
          echo "=== unused let (W004, ok true) ==="
          cat > /tmp/check_unused.purr <<'EOP'
          let unused = "x";

          host x270 {
              s = "hello";
          }
          EOP
          /tmp/purr-bin/bin/purr check /tmp/check_unused.purr --json > /tmp/unused.json 2> /tmp/unused.stderr
          jq -e '.ok == true and .diagnostics[0].code == "W004"' /tmp/unused.json
          test ! -s /tmp/unused.stderr
          echo "=== stdout exclusively JSON ==="
          /tmp/purr-bin/bin/purr check purr/examples/minimal.purr --json > /tmp/stdout.json 2> /tmp/stderr.txt
          jq -e 'has("file") and has("ok") and has("diagnostics")' /tmp/stdout.json
          test ! -s /tmp/stderr.txt

  nixfleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-store-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-
      - run: nix build .#checks.x86_64-linux.nixfleet-tests --fallback
        name: Build and test Go code
      - run: nix build .#nixfleet-web --fallback
        name: Build frontend
      - run: nix build .#nixfleet-manifest .#nixfleet-ui --fallback
        name: Evaluate nixfleet artifacts

  nixfleet-manifest:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - name: Build artifacts
        run: |
          nix build .#nixfleet-manifest --out-link /tmp/nixfleet-manifest
          nix build .#nixfleet-ui --out-link /tmp/nixfleet-ui
          mkdir -p nixfleet/artifacts
          cp /tmp/nixfleet-manifest nixfleet/artifacts/manifest.json
          cp /tmp/nixfleet-ui nixfleet/artifacts/ui.json
      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nixfleet/artifacts/
          git diff --cached --quiet || git commit -m "chore(nixfleet): update artifacts [skip ci]"
          git push

  topology:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - name: Build topology diagrams
        run: nix build .#topology
      - name: Update docs/topology/
        run: |
          mkdir -p docs/topology
          cp result/main.svg docs/topology/main.svg
          cp result/network.svg docs/topology/network.svg
      - name: Commit updated topology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/topology/
          git diff --cached --quiet || git commit -m "chore: update topology diagrams [skip ci]"
          git push
