name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix eval .#formatter.x86_64-linux.drvPath --raw
        name: Evaluate formatter output
      - run: nix eval .#devShells.x86_64-linux.default.drvPath --raw
        name: Evaluate dev shell output
      - run: nix eval .#apps.x86_64-linux.rebuild.type --raw
        name: Evaluate app outputs

  check-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm
          sudo docker rmi $(docker image ls -aq) 2>/dev/null || true
          df -h
      - uses: ./.github/actions/setup-nix
      - run: nix build .#full-ci-checks --fallback
        name: Run full CI checks

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix eval .#nixosConfigurations.omen.config.system.build.toplevel.outPath --raw
        name: Evaluate NixOS config

  topology:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - name: Build topology diagrams
        run: nix build .#topology
      - name: Update docs/topology/
        run: |
          mkdir -p docs/topology
          cp result/main.svg docs/topology/main.svg
          cp result/network.svg docs/topology/network.svg
      - name: Commit updated topology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/topology/
          git diff --cached --quiet || git commit -m "chore: update topology diagrams [skip ci]"
          git push
